services:
  - type: web
    name: daily-report-dashboard
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm run web
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: ALLOW_SUBMIT
        value: "false"
      - key: FORM_URL
        value: https://forms.cloud.microsoft/pages/responsepage.aspx?id=0AXnVXRck0GwwTa-4NQ-bvGJJtgnRZ5Fseet11Dp2IdUNDM3UUNaSVQySjBDSzc5WExJUzVOM0lLNS4u&origin=lprLink&route=shorturl
      - key: REVIEW_USER
        sync: false
      - key: REVIEW_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          name: daily-report-kv
          type: keyvalue
          property: connectionString
      - key: STATE_TTL_SECONDS
        value: "604800"
      - key: HISTORY_TTL_SECONDS
        value: "7776000"

  - type: cron
    name: daily-report-runner
    runtime: node
    region: singapore
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run daily
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: FORM_URL
        value: https://forms.cloud.microsoft/pages/responsepage.aspx?id=0AXnVXRck0GwwTa-4NQ-bvGJJtgnRZ5Fseet11Dp2IdUNDM3UUNaSVQySjBDSzc5WExJUzVOM0lLNS4u&origin=lprLink&route=shorturl
      - key: REDIS_URL
        fromService:
          name: daily-report-kv
          type: keyvalue
          property: connectionString
      - key: STATE_TTL_SECONDS
        value: "604800"
      - key: HISTORY_TTL_SECONDS
        value: "7776000"

  - type: keyvalue
    name: daily-report-kv
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []
